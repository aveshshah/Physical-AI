# Qwen3-VL-4B for use *while Isaac Sim is running* (both share the RTX 5060 Ti's 16 GB).
# 4-bit 4B needs ~3-4 GB of VRAM, leaving the rest for Isaac Sim rendering + physics.
model:
  backend: transformers
  model_id: Qwen/Qwen3-VL-4B-Instruct
  dtype: bfloat16
  quantization: 4bit
  max_new_tokens: 512
  temperature: 0.2          # more deterministic answers for robot goals

media:
  image_max_side: 960
  video_frame_max_side: 448
  video_fps: 2.0
  video_max_frames: 12

chat:
  max_history_turns: 6
  keep_media_turns: 1

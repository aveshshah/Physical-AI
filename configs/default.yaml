# Local GPU, full precision (bf16). Needs ~20 GB of VRAM (RTX 3090/4090/5090, A5000, ...).
model:
  backend: transformers
  model_id: Qwen/Qwen3-VL-8B-Instruct
  dtype: bfloat16
  quantization: null
  attn_implementation: null      # "flash_attention_2" if flash-attn is installed
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.8
  top_k: 20

media:
  image_max_side: 1280
  video_frame_max_side: 640
  video_fps: 2.0
  video_max_frames: 32
  webcam_source: 0               # index, file, rtsp://..., or a GStreamer pipeline
  webcam_buffer_seconds: 10
  webcam_buffer_fps: 2

chat:
  max_history_turns: 12
  keep_media_turns: 2
